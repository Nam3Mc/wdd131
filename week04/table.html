<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/table.css">
    <title>Table</title>
</head>
<body>
    <table>
        <caption>Subscription Plans</caption>
        <thead>
            <tr>
                <th></th>
                <th>Basic</th>
                <th>Premium</th>
                <th>Deluxe</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Storage</td>
                <td>100GB</td>
                <td>1TB</td>
                <td>2TB</td>
            </tr>
            <tr>
                <td>Price</td>
                <td>$10</td>
                <td>$20</td>
                <td>$30</td>
                </tr>
            <tr>
                <td>Support</td>
                <td>Email Support</td>
                <td>24/7 Phone Support</td>
                <td>Dedicated Account Manager</td>
            </tr>
        </tbody>
        <tfoot></tfoot>
            <tr>
                <td colspan="4">*All plans include a 30-day money-back guarantee.</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
