<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Reviews | Las Repollas del Abuelo</title>
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/reviews.css"> <link rel="stylesheet" href="styles/larger.css" media="screen and (min-width: 768px)">
    <script src="scripts/main.js" defer></script>
    <script src="scripts/reviews.js" defer></script>
</head>
<body>
    <header class="main-header">
        <div class="container header-flex">
            <div class="logo-container">
                <span class="brand-name">Las Repollas <br><span>del Abuelo</span></span>
            </div>
            <nav aria-label="Main Navigation">
                <button id="menu-toggle" aria-label="Toggle Menu">≡</button>
                <ul class="nav-menu">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="cart.html">Cart</a></li>
                    <li><a href="review.html" class="active">Reviews</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container review-page">
        <section class="review-intro">
            <h1>Customer Feedback</h1>
            <p>Your opinion helps us keep the "Abuelo's" tradition alive. Tell us what you think!</p>
        </section>

        <div class="review-layout">
            <section class="form-container">
                <h3>Leave a Review</h3>
                <form id="product-review-form">
                    <div class="form-group">
                        <label for="product-choice">Which product did you try?</label>
                        <select id="product-choice" required>
                            <option value="" disabled selected>Select a product...</option>
                            <option value="Classic Vanilla">Classic Vanilla</option>
                            <option value="Belgian Chocolate">Belgian Chocolate</option>
                            <option value="Salted Caramel">Salted Caramel</option>
                            <option value="Sicilian Pistachio">Sicilian Pistachio</option>
                            <option value="Other">Other Flavor</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="rating">Rating</label>
                        <select id="rating" required>
                            <option value="5">★★★★★ (Excellent)</option>
                            <option value="4">★★★★☆ (Great)</option>
                            <option value="3">★★★☆☆ (Good)</option>
                            <option value="2">★★☆☆☆ (Fair)</option>
                            <option value="1">★☆☆☆☆ (Poor)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="review-text">Your Experience</label>
                        <textarea id="review-text" rows="5" placeholder="How was the flavor? The texture? The service?" required></textarea>
                    </div>

                    <button type="submit" class="cta-button">Submit Review</button>
                </form>
            </section>

            <section class="feed-container">
                <h3>Recent Testimonials</h3>
                <div id="reviews-list">
                    </div>
            </section>
        </div>
    </main>

    <footer class="main-footer">
        </footer>
</body>
</html>
