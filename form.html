<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="WDD 131 – Dynamic Web Fundamentals - Form Practice codding">
    <meta name="author" content="Dreiser Morales">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/getdates.js" defer></script>
    <script src="scripts/form.js" defer></script>
    <title>Product Review</title>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <form method="get" action="review.html">
        <fieldset>
            <label for="selected" id="slct">Product Name</label>
            <select name="product" id="selected" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>
        </fieldset>

        <fieldset>
            <div> Overall Rating </div>
            <label for="rate1"><input type="radio" name="rate" id="rate1" value="1" required> &#9734; </label>
            <label for="rate2"><input type="radio" name="rate" id="rate2" value="2" required> &#9734; &#9734; </label>
            <label for="rate3"><input type="radio" name="rate" id="rate3" value="3" required>  &#9734; &#9734; &#9734; </label>
            <label for="rate4"><input type="radio" name="rate" id="rate4" value="4" required> &#9734; &#9734; &#9734; &#9734; </label>
            <label for="rate5"><input type="radio" name="rate" id="rate5" value="5" required> &#9734; &#9734; &#9734; &#9734; &#9734; </label>
        </fieldset>
        
        <fieldset>
            <label for="date" id="slct"2> Date of Installation <input type="date" name="date" id="date" required> </label>
        </fieldset>
        
        <fieldset>
            <div> Which features did you find usefull in the product? <br><span>(check all that apply)</span></div>
            <label for="durability"> <input type="checkbox" name="durability" id="durability" value="yes">Durability </label>
            <label for="usedFrendly"> <input type="checkbox" name="usedFrendly" id="usedFrendly" value="yes">Ease of Use </label>
            <label for="performance"> <input type="checkbox" name="performance" id="performance" value="yes">Performance </label>
            <label for="design"> <input type="checkbox" name="design" id="design" value="yes">Design </label>
        </fieldset>

        <fieldset>
            <label for="review" id="slct3"> Written Review <span>(optional)</span> <textarea name="review" id="review"></textarea> </label>
            <label for="userName" id="slct4"> Your Name <span>(optional)</span> <input type="text" id="userName" name="userName"></label>
        </fieldset> 
        <input type="submit" value="Post Review" id="postReviewBtn">
    </form>

    <footer>        
        <p><span>&copy;2025</span> * Dreiser Morales Chacón * Colombia</p>
        <p id="date_update"></p>
    </footer>
</body>
</html>
