<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="WDD 131 – Dynamic Web Fundamentals - Form Practice Coding">
    <meta name="author" content="Dreiser Morales">

    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/form.css">

    <script src="scripts/getdates.js" defer></script>
    <script src="scripts/form.js" defer></script>

    <title>Product Review</title>
</head>
<body>

<header>
    <h1>Product Review</h1>
</header>

<main>
    <form method="get" action="review.html">

        <!-- Product Name -->
        <fieldset>
            <label for="selected">Product Name</label>
            <select name="product" id="selected" required>
                <option value="" disabled selected>Select a Product...</option>
            </select>
        </fieldset>

        <!-- Rating -->

        <fieldset>
            <legend>Overall Rating</legend>
                
            <label for="rate1">
                <input type="radio" id="rate1" name="rate" value="1" required>
                &#9734;
            </label>
        
            <label for="rate2">
                <input type="radio" id="rate2" name="rate" value="2" required>
                &#9734; &#9734;
            </label>
        
            <label for="rate3">
                <input type="radio" id="rate3" name="rate" value="3" required>
                &#9734; &#9734; &#9734;
            </label>
        
            <label for="rate4">
                <input type="radio" id="rate4" name="rate" value="4" required>
                &#9734; &#9734; &#9734; &#9734;
            </label>
        
            <label for="rate5">
                <input type="radio" id="rate5" name="rate" value="5" required>
                &#9734; &#9734; &#9734; &#9734; &#9734;
            </label>
        </fieldset>

        <!-- Installation Date -->
        <fieldset>
            <label for="date">Date of Installation</label>
            <input type="date" name="date" id="date" required>
        </fieldset>

        <!-- Features -->

        <fieldset>
            <legend>
                Which features did you find useful in the product?
                <br><span>(check all that apply)</span>
            </legend>
        
            <input type="checkbox" id="durability" name="durability" value="yes">
            <label for="durability">Durability</label>
        
            <input type="checkbox" id="userFriendly" name="userFriendly" value="yes">
            <label for="userFriendly">Ease of Use</label>
        
            <input type="checkbox" id="performance" name="performance" value="yes">
            <label for="performance">Performance</label>
        
            <input type="checkbox" id="design" name="design" value="yes">
            <label for="design">Design</label>
        </fieldset>
        <!-- Review & Name -->
        <fieldset>
            <label for="review">
                Written Review <span>(optional)</span>
            </label>
            <textarea name="review" id="review"></textarea>

            <label for="userName">
                Your Name <span>(optional)</span>
            </label>
            <input type="text" id="userName" name="userName">
        </fieldset>

        <input type="submit" value="Post Review" id="postReviewBtn">

    </form>
</main>

<footer>
    <p>&copy;2025 • Dreiser Morales Chacón • Colombia</p>
    <p id="date_update"></p>
</footer>

</body>
</html>
